<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzIA Gerencial - Agente Financiero IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="header-info">
                <h2>💼 FinanzIA Gerencial</h2>
                <p>Especialista en Comisiones, Accruals y Automatización de Datos</p>
            </div>
            <div class="api-key-box">
                <input type="password" id="apiKey" placeholder="Pega tu Gemini API Key aquí">
                <button onclick="saveApiKey()">Guardar</button>
            </div>
        </header>

        <main id="chatBox" class="chat-box">
            <div class="message agent">
                <strong>FinanzIA gerencial:</strong> Hola. Estoy listo para ayudarte a conciliar comisiones, calcular accruals vs. pagos reales, unificar tus archivos dispersos de Excel o diseñar plantillas masivas. ¿Qué caso revisamos hoy?
            </div>
        </main>

        <footer class="input-area">
            <textarea id="userInput" rows="3" placeholder="Pega datos de comisiones, pide fórmulas masivas o describe el problema del archivo..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
